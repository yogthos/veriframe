name: tests

on:
  push:
    branches: [main, clojure]
  pull_request:
    branches: [main, clojure]
  workflow_dispatch:

# Cancel in-progress runs on the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: engines + control layer (no Lean)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Building jolt from source needs Chez and a C toolchain; the release
      # binary is self-contained, so the install script is the cheap path.
      - name: Install jolt
        run: |
          curl -sL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Z3 and SWI-Prolog
        # The smoke job checks clpfd explicitly rather than trusting a version
        # number, because a swipl without it passes a naive check and then
        # fails every real query.
        run: |
          sudo apt-get update
          sudo apt-get install -y z3 swi-prolog-core
          z3 --version
          swipl --version

      - name: Cache jolt gitlibs
        uses: actions/cache@v4
        with:
          path: ~/.jolt/gitlibs
          key: jolt-gitlibs-${{ hashFiles('deps.edn') }}

      - name: Fetch dependencies
        run: jolt -P

      - name: Test suite
        # Offline and deterministic: engines, linters, templates, the arbiter,
        # gate config, verdict parsing, the journal. No provider calls.
        run: jolt -M:test

  smoke:
    name: platform probes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: fast
    steps:
      - uses: actions/checkout@v4

      - name: Install jolt
        run: |
          curl -sL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Z3 and SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install -y z3 swi-prolog-core

      - name: Cache jolt gitlibs
        uses: actions/cache@v4
        with:
          path: ~/.jolt/gitlibs
          key: jolt-gitlibs-${{ hashFiles('deps.edn') }}

      - name: Probes
        # Every probe corresponds to a stated risk in PLAN.md: concurrent swipl
        # sessions, FTS5 through the FFI binding, serialized store access,
        # HTTPS surviving the nREPL load, and /health answering while a handler
        # is busy. The provider probes skip without a key rather than failing,
        # so a fork with no secret still gets a useful run.
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: jolt smoke

  build:
    name: standalone binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: fast
    steps:
      - uses: actions/checkout@v4

      - name: Install jolt
        run: |
          curl -sL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache jolt gitlibs
        uses: actions/cache@v4
        with:
          path: ~/.jolt/gitlibs
          key: jolt-gitlibs-${{ hashFiles('deps.edn') }}

      # `jolt build` embeds only what it can reach statically, so this job
      # guards against a dynamic require silently dropping a subtree from the
      # image — which happened once and only surfaced at startup.
      - name: Build
        run: jolt build -m veriframe.core -o veriframe

      # Two assertions. That it starts and serves, and that its TLS still works:
      # a built image used to resolve SSL_* to whatever the process linked rather
      # than the OpenSSL under :jolt/native, which faulted instead of erroring.
      # The boot-time provider warm-up drives a real handshake, and without a key
      # it fails on auth AFTER the handshake — so the thing to assert is the
      # absence of the fault, which needs no secret.
      - name: Binary starts and serves
        run: |
          HARNESS_PORT=3010 HARNESS_DB=ci.sqlite3 ./veriframe >boot.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3010/health >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3010/health | tee /dev/stderr | grep -q '"status":"ok"'
          cat boot.log
          ! grep -q 'invalid memory reference' boot.log
          grep -q 'nREPL server started' boot.log

  lean:
    name: full suite with Lean 4 and Mathlib
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: fast
    # Mathlib runs to several GB even from the olean cache, so this does not
    # gate a pull request. It runs on main and on demand.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install jolt
        run: |
          curl -sL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Z3 and SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install -y z3 swi-prolog-core

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: elan-${{ hashFiles('tools/lean-workspace/lean-toolchain') }}

      - name: Cache Mathlib packages and oleans
        uses: actions/cache@v4
        with:
          path: |
            tools/lean-workspace/.lake
            tools/lean-workspace/lake-manifest.json
          key: lake-${{ hashFiles('tools/lean-workspace/lakefile.toml', 'tools/lean-workspace/lean-toolchain') }}

      - name: Cache the repl build
        uses: actions/cache@v4
        with:
          path: tools/lean-repl
          key: lean-repl-${{ hashFiles('tools/setup-lean.sh') }}

      - name: Fetch Mathlib and build the repl
        run: ./tools/setup-lean.sh

      - name: Cache jolt gitlibs
        uses: actions/cache@v4
        with:
          path: ~/.jolt/gitlibs
          key: jolt-gitlibs-${{ hashFiles('deps.edn') }}

      - name: Test suite
        run: jolt -M:test

      - name: Lean reachable from the harness
        # The three details that cost time to find: the repl must be spawned
        # through `lake env` from the workspace, `lake` needs an absolute path
        # because a child resolves its executable against the parent's PATH,
        # and the repl has to be pinned to the commit whose toolchain matches
        # the workspace rather than handed an override.
        run: |
          jolt -e "(require '[veriframe.engine.lean-repl :as lr] '[veriframe.config :as c])
                   (let [cfg (get-in (c/load-config) [:engines :lean])
                         s (lr/create-session cfg)]
                     (try
                       (assert (some? (lr/mathlib-env s)))
                       (assert (:ok (lr/run-command s \"theorem ci (n : Nat) : n + 0 = n := by simp\")))
                       (println :lean-ok)
                       (finally (lr/dispose! s))))"
